name: Deploy Pixrup

on:
  push:
    branches: [main, stg]

concurrency:
  group: deploy-pixrup-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            env: production
            app_name: pixrup
            app_url: https://pixrup.com
            deploy_path: /var/www/pixrup-prod
            build_cmd: npm run build:prod
            php_fpm: php8.4-fpm
            php_bin: /usr/bin/php8.4
            composer_bin: /usr/local/bin/composer
          - branch: stg
            env: stg
            app_name: pixrup_stg
            app_url: https://stg.pixrup.com
            deploy_path: /var/www/pixrup-stg
            build_cmd: npm run build:staging
            php_fpm: php8.4-fpm
            php_bin: /usr/bin/php8.4
            composer_bin: /usr/local/bin/composer

    environment: ${{ matrix.env }}

    steps:
      - name: 🧩 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          if [[ ! -s ~/.ssh/id_ed25519 ]]; then
            echo "❌ SSH private key file is empty after decoding"
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Opcional: úsalo mientras estabilizas, luego bórralo.
      - name: 📜 SSH Debug Logs
        run: |
          set -euo pipefail
          ls -al ~/.ssh
          echo "📏 id_ed25519 size: $(wc -c < ~/.ssh/id_ed25519) bytes"
          echo "🔒 id_ed25519 permissions: $(stat --format '%a' ~/.ssh/id_ed25519)"
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keygen -l -f ~/.ssh/id_ed25519.pub
          rm -f ~/.ssh/id_ed25519.pub

      - name: 🔍 Test SSH Connection
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
            "echo '✅ SSH OK on ' \$(hostname)"

      - name: 🚀 Deploy Laravel App
        run: |
          set -euo pipefail

          if [ "${{ github.ref_name }}" != "${{ matrix.branch }}" ]; then
            echo "Skipping deploy: current branch (${{ github.ref_name }}) != matrix branch (${{ matrix.branch }})"
            exit 0
          fi

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << EOF
            set -Eeuo pipefail
            trap 'echo "[deploy] Failed at line \$LINENO" >&2' ERR

            cd "${{ matrix.deploy_path }}"
            echo "🌱 Deploying ${{ matrix.app_name }} on ${{ matrix.app_url }}"

            # 1) Código
            git fetch --prune origin
            git reset --hard origin/${{ github.ref_name }}
            git clean -xfd

            # 2) Sanity: PHP + intl
            echo "🐘 PHP version:"
            ${{ matrix.php_bin }} -v
            echo "🌐 PHP intl extension:"
            ${{ matrix.php_bin }} -m | grep -i '^intl$' >/dev/null

            # 3) .env debe existir en el server (NO lo generamos desde GitHub)
            if [ ! -f .env ]; then
              echo "❌ Missing .env in ${{ matrix.deploy_path }}. Create it once on the server and re-run."
              exit 1
            fi

            # 4) Dependencias (lock debe calzar con el server)
            echo "🧩 Updating dependencies"
            ${{ matrix.php_bin }} ${{ matrix.composer_bin }} install --no-dev --prefer-dist --optimize-autoloader

            # 5) Frontend
            echo "⚙️ Building frontend"
            npm ci
            ${{ matrix.build_cmd }}

            # 6) Laravel
            echo "🚀 Running migrations and caches"
            ${{ matrix.php_bin }} artisan migrate --force
            ${{ matrix.php_bin }} artisan config:cache
            ${{ matrix.php_bin }} artisan route:cache
            ${{ matrix.php_bin }} artisan view:cache
            ${{ matrix.php_bin }} artisan storage:link 2>/dev/null || true

            # 7) Workers (Horizon)
            if [ "${{ github.ref_name }}" = "stg" ]; then
              echo "🔍 Staging: restarting Horizon"
              sudo systemctl restart horizon-stg
            else
              echo "🧱 Production: restarting Horizon"
              sudo systemctl restart horizon-prod
            fi

            # 8) PHP-FPM
            sudo systemctl restart ${{ matrix.php_fpm }}

            echo "✅ Deploy completed successfully!"
          EOF
